    <!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Vehicle - SAMpark</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>
    
    <h1>Add Your Vehicle</h1>

    <form action="/vehicle/add" method="POST">

        <label>Vehicle Name</label>

        <br>

        <input
            type="text"
            name="vehicle_name"
            placeholder="Hyundai i10 Nios"
            required
        >

        <br><br>


        <label>Car Number</label>

        <br>

        <input
            type="text"
            name="registration_number"
            placeholder="MH05AB1234"
            required
        >

        <br><br>


        <button type="submit">
            Add Vehicle
        </button>

    </form>

</body>

</html>
</body>
</html>
